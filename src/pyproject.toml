[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asimov"
version = "0.1.0"
description = "Asimov computer vision and terminal I/O library"
requires-python = ">=3.9,<3.13"
license = "GPL-2.0-or-later"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "cvzone>=1.5.6",
    "mediapipe>=0.8.9",
    "numpy>=1.21.0",
    "opencv-python>=4.5.0",
    "pyvirtualcam>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "ruff",
    "asimov-demo",
]

[project.urls]
Homepage = "https://zoidtechnologies.com/asimov/"

[project.scripts]
asimov = "asimov.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["asimov", "asimov.base", "asimov.io", "asimov.net", "asimov.modules", "asimov.playingcard"]